assets = { directory = ".open-next/assets", binding = "ASSETS" }

routes = [
  { pattern = "studentathlete.dk/*", zone_name = "studentathlete.dk" },
  { pattern = "www.studentathlete.dk/*", zone_name = "studentathlete.dk" }
