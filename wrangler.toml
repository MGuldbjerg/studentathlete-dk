name = "studentathlete-dk"
main = ".open-next/worker.js"
# Workers Caching (cache-blokken nedenfor) udkom juli 2026. Datoen stod på
# 2025-01-01 — halvandet år ældre end funktionen — og cachen svarede aldrig:
# hverken cf-cache-status eller age på gentagne kald, altså kørte workeren hver
# eneste gang. Uden cache-hits er 10 ms CPU-loftet det eneste, der står mellem
# en sideanmodning og fejl 1102.
compatibility_date = "2026-09-21"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# UK bruger `custom_domain` frem for et route-mønster: så opretter Cloudflare
# selv den proxied DNS-record + certifikatet. Tokenet har Workers-adgang på
# kontoniveau, men INGEN DNS-rettighed på .co.uk-zonen — med et rent
# route-mønster ville domænet derfor kræve manuelle DNS-records i dashboardet.
#
# ⚠️ STÅR HER MED VILJE, FØR ENHVER [tabel]. I TOML hører alt efter en
# tabel-header til den tabel, indtil den næste begynder. Da `[cache]` blev
# tilføjet OVER det her, blev `routes` altså til `cache.routes` — og fordi
# wrangler 4.66 kastede hele den ukendte `cache`-tabel væk, forsvandt ruterne
# med den, i tavshed. Sitet blev ved med at svare, fordi Cloudflare beholder
# ruter fra tidligere deploys, så intet så galt ud. Opgraderingen til 4.131
# afslørede det: «Unexpected fields found in cache field: "routes"».
routes = [
  { pattern = "studentathlete.dk/*", zone_name = "studentathlete.dk" },
  { pattern = "www.studentathlete.dk/*", zone_name = "studentathlete.dk" },
  { pattern = "student-athlete.co.uk", custom_domain = true },
  { pattern = "www.student-athlete.co.uk", custom_domain = true }
]

# Workers Cache: Cloudflare svarer fra cachen UDEN at køre Workeren, og altså
# uden at røre D1. Det er den eneste mekanisme der kan det — zonens Cache
# Rules kan IKKE cache et Worker-svar, for Workeren kører FØR cachen.
#
# ⚠️ Den cacher ethvert 200-svar uden `Cache-Control` i TO TIMER. Derfor er
# omfanget snævert med vilje:
#
#   feed.xml, ads.txt   sætter selv Cache-Control (1 time / 5 min) — de
#                       headere har stået i koden hele tiden og virker først nu
#   sitemap.xml,        caches IKKE. Målt 2026-09-02: Next sætter selv
#   robots.txt          `public, max-age=0, must-revalidate` på dem, og det
#                       forbyder cachen at gemme dem. Konventionerne kan ikke
#                       sætte egne headere, så skal sitemappet caches, skal det
#                       laves om til en rute (app/sitemap.xml/route.ts). Det er
#                       ikke gjort — forespørgslen kostede 2,1 mio. rækker og
#                       koster nu ~1.200, så cachen er blevet pynt
#   læsersiderne        middlewaren sætter `public, max-age=0, s-maxage=300`
#                       (se src/middleware.ts): kanten må gemme dem i fem
#                       minutter, browseren skal spørge hver gang
#   /admin, /api/admin  middlewaren sætter `no-store` — heller ikke browseren
#   /api/mcp*           sætter selv `no-store` — middlewaren rammer dem ikke
#
# ✅ VIRKER FRA 2026-09-14. Blokken blev droppet i tavshed så længe projektet
# kørte wrangler 4.66 («Unexpected fields found in top-level field: cache»).
# wrangler er nu 4.131, og `wrangler deploy --dry-run` advarer ikke længere.
#
# Hvorfor det hastede: uden cachen kørte Workeren ved HVERT sidevisning, og
# 40-60 % af alle forespørgsler svarede 503 (Cloudflare-fejl 1102, CPU-grænsen
# på 10 ms) — målt på begge sites 2026-09-14. `private` på læsersiderne holdt
# kanten ude med vilje, fordi to timer var for længe når `pages` og
# `site_content` ikke har nogen kladdetilstand. Med et eksplicit `s-maxage` er
# vinduet vores eget at vælge, og så er der ingen grund til at holde kanten ude.
#
# Slår man dette fra igen, holder headerne bare op med at have effekt; intet
# andet i koden afhænger af det.
[cache]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "studentathlete-dk"
database_id = "5332ad3b-d908-4e39-b863-22a2cf0e82a0"