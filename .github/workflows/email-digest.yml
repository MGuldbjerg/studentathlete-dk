name: Weekly email digest

# Mondays 07:10 UTC. A DRY RUN unless the repo variable DIGEST_SEND is "1":
# sending is a publication and is switched on by Mikkel only (CLAUDE.md). Even
# then, only sites whose country profile has `emailDigest` on are sent to.
on:
  schedule:
    - cron: '10 7 * * 1'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build (and, if switched on, send) the digest
        run: npx tsx pipeline/digest/send-digest.ts ${{ vars.DIGEST_SEND == '1' && '--send' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}

      - name: Discord notification on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "❌ Email digest failed"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          detail: "The weekly email digest run failed."
