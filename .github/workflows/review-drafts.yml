name: Claude-gennemgang af kladder

# Claude's review of each draft, moved off Mikkel's PC (2026-09-28). The local
# run depended on the machine being on and skipped whole nights; this one
# doesn't. It uses Mikkel's Claude subscription through a long-lived token
# (`claude setup-token` → secret CLAUDE_CODE_OAUTH_TOKEN), not an API key, so
# the $0 principle holds.
#
# REVIEW ONLY: verdicts go to D1 (/admin) and Discord. The run never corrects,
# rejects or publishes — scripts/review-drafts.sh --review-only enforces it.
#
# The repo is public, so this log is public. Draft text, packs and Claude's
# answers stay in the runner's temp files, which die with the runner; nothing is
# uploaded as an artifact, and REVIEW_PUBLIC_LOG=1 keeps titles and summaries
# out of stdout. Never add an upload-artifact step here.
#
# Every 3 hours, 20 minutes after the mechanical check (check-drafts.yml, :20).

on:
  schedule:
    - cron: '40 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Vis kun hvad der ville blive gennemgået'
        type: boolean
        default: false

concurrency:
  group: review-drafts
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code

      # Look at the queue before spending a Claude call on the account probe: most
      # runs find nothing (median run 0.9 min), and the probe cost ~8 calls/day.
      # Token health is still watched every few hours — the desk (every 4 h) and
      # drafting (3×/day) run the same probe and alert on failure (2026-10-28).
      # The mechanical check-drafts.ts runs on its own in check-drafts.yml.
      # A failing list doesn't skip silently: it reviews anyway.
      - name: Anything to review?
        id: queue
        run: |
          if out=$(npx tsx pipeline/generate/draft-pack.ts --list); then
            n=$(printf '%s\n' "$out" | tr -d '\r' | grep -cE '^[0-9]+$' || true)
          else
            echo "::warning::queue check failed — reviewing anyway"; n=unknown
          fi
          echo "Drafts waiting for review: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      # Main Claude account, or the fallback when the main one is at its limit
      # (.github/actions/claude-account). Later steps must not set the token.
      - name: Pick a Claude account
        if: steps.queue.outputs.n != '0'
        uses: ./.github/actions/claude-account
        with:
          primary: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fallback: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}

      - name: Gennemgå kladder (kun dom)
        if: steps.queue.outputs.n != '0'
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "! CLAUDE_CODE_OAUTH_TOKEN mangler — kør 'claude setup-token' og læg den som repo-secret"; exit 1
          fi
          ARGS="--review-only"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          ./scripts/review-drafts.sh $ARGS
        env:
          REVIEW_PUBLIC_LOG: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Discord ved fejl
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "❌ Claude-gennemgang af kladder fejlede"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
