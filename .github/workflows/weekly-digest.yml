name: Ugentlig Discord-digest

on:
  schedule:
    # Mandag kl. 08:00 UTC (10:00 dansk sommertid)
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Send ugentlig statistik til Discord
        run: npx tsx pipeline/stats/weekly-digest.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          # Kanal pr. land — ét ekstra land = én ekstra linje her.
          # Mangler et lands secret, falder notify.ts tilbage til fælleskanalen.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_DK: ${{ secrets.DISCORD_WEBHOOK_DK }}
          DISCORD_WEBHOOK_UK: ${{ secrets.DISCORD_WEBHOOK_UK }}

      # Succes poster digesten selv (scriptet ovenfor). Her dækkes KUN fejl-tilfældet,
      # så et brudt digest-job ikke fejler tavst (jf. SQLITE-fejlen 2026-06-02).
      # Gælder både planlagt og manuel (/stats) kørsel.
      - name: Discord-notifikation ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Ugentlig digest fejlede\",\"description\":\"Statistik-digesten kunne ikke sendes. [Se loggen]($RUN_URL).\",\"color\":15158332,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
