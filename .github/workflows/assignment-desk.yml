name: Assignment desk

# Mikkel, 2026-10-27: Claude as the editor who decides what each incoming story
# becomes: article, profile line, fold, skip or hold (pipeline/editor/assignment-desk.ts,
# rules in pipeline/editor/brief.md). SHADOW MODE: decisions go to D1
# (desk_decisions) and Discord; drafting runs exactly as before, and nothing
# reads the decisions but `assignment-desk.ts --report`.
#
# Runs on Mikkel's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), not an API key.
# The repo is public, so this log is public: stdout is story ids and decisions
# only; angles, lines and reasons go to D1 and Discord. Never add an
# upload-artifact step here.
#
# Every 4 hours (was 3 a day; Mikkel 2026-10-27 «ramp up the processes», with
# discovery now every 2 h): smaller batches, and a decision soon after a story
# is found. 13:05 still lands 25 minutes before generate-manual (:30). In
# shadow mode the order doesn't matter.
#
# Manual run with backtest dates: decides past stories as of their discovery,
# stored as mode 'backtest' and never sent to Discord.
#
# Off switch: repo variable ASSIGNMENT_DESK = off.

on:
  schedule:
    - cron: '5 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      backtest_from:
        description: 'Backtest: first discovery date (YYYY-MM-DD); empty = a normal shadow run'
        default: ''
      backtest_to:
        description: 'Backtest: last discovery date (YYYY-MM-DD)'
        default: ''
      limit:
        description: 'Stories at most'
        default: '80'
      run:
        description: 'Backtest: a name for this run, kept apart from earlier backtests (e.g. v2)'
        default: ''

permissions:
  contents: read
  actions: read  # lets the failure alert name the failed step

concurrency:
  group: assignment-desk
  cancel-in-progress: false

jobs:
  desk:
    if: vars.ASSIGNMENT_DESK != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code

      # Main Claude account, or the fallback when the main one is at its limit
      # (.github/actions/claude-account). Later steps must not set the token.
      - name: Pick a Claude account
        uses: ./.github/actions/claude-account
        with:
          primary: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fallback: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}

      - name: The desk decides
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '80' }}"
          if [ -n "${{ github.event.inputs.backtest_from }}" ]; then
            ARGS="$ARGS --backtest --from ${{ github.event.inputs.backtest_from }} --to ${{ github.event.inputs.backtest_to }}"
            if [ -n "${{ github.event.inputs.run }}" ]; then ARGS="$ARGS --run ${{ github.event.inputs.run }}"; fi
          fi
          npx tsx pipeline/editor/assignment-desk.ts $ARGS
        env:
          # LIVE since 2026-10-27 (Mikkel: «switch on the editor»): lines go on the
          # profile, skips/folds/holds leave the queue, generate drafts only the
          # articles. Repo variable DESK_MODE=shadow turns the acting off.
          DESK_MODE: ${{ vars.DESK_MODE || 'live' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_UK: ${{ secrets.DISCORD_WEBHOOK_UK }}

      - name: Discord on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "❌ Assignment desk failed"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
