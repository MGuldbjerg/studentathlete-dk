name: Ugentlig D1-backup

# Eksporterer hele produktions-databasen (schema + data) som SQL og gemmer den
# som GitHub Actions-artefakt (90 dages opbevaring → altid ~13 ugentlige punkter).
# $0-princip: ingen ekstern storage. D1 Time Travel dækker kun 30 dage og
# beskytter ikke mod fx en destruktiv seed-kørsel opdaget sent.
#
# 🛑 ENCRYPTED, ALWAYS (2026-11-23). The repo is PUBLIC, and a public repo's
# artifacts can be downloaded by anyone signed in to GitHub. Until this date the
# dump went up as plain SQL: school contacts, ledger notes, and any future digest
# subscriber. Now the dump is encrypted with AES-256 (gpg, symmetric) under the
# secret D1_BACKUP_PASSPHRASE, and the job FAILS rather than upload plaintext
# when the secret is missing. Mikkel keeps a copy of the passphrase outside
# GitHub — without it the backups cannot be read. Restore: docs/RUNBOOK.md.
on:
  schedule:
    # Lørdag 02:00 UTC — FØR søndagens weekly-scrape rører databasen
    - cron: '0 2 * * 6'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refuse to run without the encryption passphrase
        env:
          PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
        run: |
          if [ ${#PASSPHRASE} -lt 20 ]; then
            echo "::error::D1_BACKUP_PASSPHRASE is missing or too short. No backup is uploaded unencrypted."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Eksportér D1 (schema + data), encrypt, check the round trip
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASSPHRASE: ${{ secrets.D1_BACKUP_PASSPHRASE }}
        run: |
          npx wrangler d1 export studentathlete-dk --remote --output=backup.sql
          gzip -9 backup.sql
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output backup.sql.gz.gpg backup.sql.gz
          # The plaintext never leaves the runner: remove it before any upload step.
          rm -f backup.sql.gz
          # Prove the file decrypts and holds a schema (a backup no one can read is no backup).
          printf '%s' "$PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt backup.sql.gz.gpg | gunzip | grep -c 'CREATE TABLE' > tables.txt
          echo "tables in the dump: $(cat tables.txt)"
          [ "$(cat tables.txt)" -ge 20 ] || { echo "::error::decrypted dump has too few tables"; exit 1; }
          ls -lh backup.sql.gz.gpg

      - name: Gem som artefakt (90 dage, encrypted only)
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error

      - name: Discord-notifikation ved fejl
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "❌ D1-backup fejlede"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          detail: "Den ugentlige database-backup kunne ikke tages (or D1_BACKUP_PASSPHRASE is missing)."
