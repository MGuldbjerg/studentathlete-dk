name: Honours roundup (Instagram)

# The monthly honours roundup (pipeline/social/post-award-roundup.ts, Mikkel
# 2026-10-22): on the 1st, last month's awards to each site's athletes as one
# Instagram post per site, the winners tagged (own-bio handles only, max 20).
# A rerun in the same month posts nothing (stats_cache 'award_roundup_posted').
# A manual run defaults to render-only: the card and caption as an artifact.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "render-only: card + caption as artifact · post: publish"
        type: choice
        options: [render-only, post]
        default: render-only
      month:
        description: "YYYY-MM (empty = last month)"
        required: false
        default: ''

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Make (and post) the roundup
        run: |
          ARGS="--out $RUNNER_TEMP/roundup"
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.mode }}" != "post" ]; then ARGS="$ARGS --render-only"; fi
          if [ -n "${{ inputs.month }}" ]; then ARGS="$ARGS --month ${{ inputs.month }}"; fi
          npx tsx pipeline/social/post-award-roundup.ts $ARGS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_UK_USER_ID: ${{ secrets.IG_UK_USER_ID }}
          IG_UK_LOGIN: instagram
          IG_UK_ACCESS_TOKEN: ${{ secrets.IG_UK_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roundup
          path: ${{ runner.temp }}/roundup
          if-no-files-found: ignore
          retention-days: 14
      - name: Discord notification on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Honours roundup failed\",\"description\":\"[See the log]($RUN_URL).\",\"color\":15158332,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
