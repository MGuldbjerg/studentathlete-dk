name: Dagligt ekspansions-katalog

# Akkumulér ALLE internationale NCAA-atleter (ikke kun danskere) i tabellen
# international_athletes. PREP, ikke live — ingen site-kode læser tabellen. Kører
# DAGLIGT så inventaret + land-tallene til pool-vs-eget-site-beslutningstræet
# fyldes hurtigt (hvert fuldt sweep skipper nogle skole-slices; daglige kørsler
# konvergerer 7× hurtigere via idempotent upsert). Public repo → gratis GH-minutter;
# ~10k D1-writes/kørsel << 100k/dag; ingen LLM.

on:
  schedule:
    # Dagligt kl. 21:00 UTC — roligt vindue: efter 18:00-discover, før 00:00-discover,
    # og fri af js-scrape (03:00) + morgen-cluster (06:30/07:00/07:30). Undgår D1-kontention.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Kør uden at skrive til DB'
        type: boolean
        default: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Slice + retry runner (ikke én lang tsx-proces): den lange kørsel exit'er
      # intermittent 0 midt i en fetch; små slices + idempotent upsert konvergerer.
      - name: Katalogisér internationale atleter (slice + retry)
        run: bash scripts/run-catalogue.sh 2>&1 | tee catalogue-run.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CATALOGUE_DRY: ${{ inputs.dry_run && '1' || '0' }}

      # Én besked når kørslen er slut — både succes og fejl (Mikkel vil have
      # færdig-besked på Discord). Botten lover "Du får besked når det er færdigt".
      - name: Discord — kørsel færdig
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ Ekspansions-katalog færdigt"
            COLOR=5793266
          else
            TITLE="❌ Ekspansions-katalog fejlede"
            COLOR=15158332
          fi
          SUMMARY="$(grep 'Runner færdig' catalogue-run.log 2>/dev/null | tail -1)"
          [ -z "$SUMMARY" ] && SUMMARY="Kørslen sluttede uden opsummering (se loggen)."
          PAYLOAD="$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$SUMMARY"$'\n\n'"[Se loggen]($RUN_URL)." \
            --argjson color "$COLOR" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds:[{title:$title,description:$desc,color:$color,footer:{text:"StudentAthlete.dk pipeline"},timestamp:$ts}]}')"
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
