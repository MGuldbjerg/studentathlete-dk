name: Reels (UK)

# Text-only Instagram reels for student-athlete.co.uk, one an hour (PLAN-reels.md).
# Mikkel 2026-10-08: UK first, no athlete tags yet, silent. GitHub starts these runs hours
# late, so any run between 08:30 and 21:00 UK time may post. Mikkel 2026-10-19: at most one
# an hour, newest article without a reel first, max age 24 hours.
#
# Hourly 07:20–20:20 UTC covers 08:30–21:00 UK in both BST and GMT; `--scheduled`
# keeps only a run inside that window and 55+ minutes after the last reel.
#
# Scheduled runs post only while the repository variable REELS_ENABLED_UK is
# 'true' — that variable is the on/off switch. A manual run defaults to
# render-only (an MP4 as a run artifact, nothing posted, nothing written).
on:
  schedule:
    - cron: '20 7-20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "render-only: MP4 only · container-only: upload to Meta, publish nothing · post: publish"
        type: choice
        options: [render-only, container-only, post]
        default: render-only
      article:
        description: "Article id (empty = pick from the last 24 hours)"
        required: false
        default: ''

jobs:
  reel:
    if: github.event_name == 'workflow_dispatch' || vars.REELS_ENABLED_UK == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Not preinstalled on ubuntu-latest any more (2026-10-08: ENOENT).
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Make (and post) the reel
        run: |
          ARGS="--country UK --out $RUNNER_TEMP/reel"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --scheduled"
          else
            case "${{ inputs.mode }}" in
              render-only) ARGS="$ARGS --render-only" ;;
              container-only) ARGS="$ARGS --container-only" ;;
            esac
            if [ -n "${{ inputs.article }}" ]; then ARGS="$ARGS --article ${{ inputs.article }}"; fi
          fi
          npx tsx pipeline/reels/make-reel.ts $ARGS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          IG_UK_USER_ID: ${{ secrets.IG_UK_USER_ID }}
          # The UK account posts via Instagram login (no Facebook page link possible).
          IG_UK_LOGIN: instagram
          IG_UK_ACCESS_TOKEN: ${{ secrets.IG_UK_ACCESS_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel
          path: ${{ runner.temp }}/reel
          if-no-files-found: ignore
          retention-days: 7

      - name: Discord notification on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "❌ UK reel failed"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          detail: "No reel today."
