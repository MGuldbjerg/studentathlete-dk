name: Ugentlig roster-scraping

on:
  schedule:
    # Søndag kl. 04:00 UTC (05:00 dansk tid)
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix:
        division: [D1, D2, D3]
      max-parallel: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Scrape rosters (${{ matrix.division }})
        run: npx tsx pipeline/scrape/scrape-rosters.ts --division ${{ matrix.division }} --limit 500 --max-age-days 30
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
