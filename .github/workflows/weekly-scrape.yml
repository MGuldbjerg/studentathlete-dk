name: Ugentlig roster-scraping

on:
  schedule:
    # Søndag kl. 04:00 UTC (05:00 dansk tid)
    - cron: '0 4 * * 0'
    # MIDLERTIDIG natlig kørsel under UK-opstarten (2026-08-04 →).
    # Scraperen roterer gennem ~1.700 skoler og fanger kun en del pr. kørsel;
    # ugentligt ville tage måneder om at finde alle briter. 22:00 UTC ligger
    # frit af de øvrige jobs (js-scrape 03:00, katalog 21:00, morgen-cluster).
    # ⚠️ FJERN denne linje igen når UK-tallet flader ud — ellers scrapes der
    # unødigt hver nat resten af sitets levetid.
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix:
        # NJCAA kom til 31/8. Tieren er 442 skoler, men kun tre sportsgrene
        # registreres (lib/divisions.ts), og jobbet finder intet før
        # find-athletics-site har bekræftet skolernes atletiksites.
        division: [D1, D2, D3, NJCAA]
      max-parallel: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Scrape rosters (${{ matrix.division }})
        # Grænsen hævet 500 → 1200 (2026-08-18): sport-inventaret gav flere rækker
        # (herre- OG kvindehold er nu to hold, ikke ét), men næsten alle requests
        # rammer nu et hold der findes — de gamle 500 var fyldt op med spøgelses-
        # sportsgrene. Med 500/uge ville en fuld runde af D1's ~6.600 hold tage et
        # kvartal. 1200 × ~1,5 s ≈ 30 min, altså rigeligt inden for timeout'et.
        run: npx tsx pipeline/scrape/scrape-rosters.ts --division ${{ matrix.division }} --limit 1200 --max-age-days 30
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

  # Efter scrape: foto-forslag fra nye bio-sider + farver for nye skoler.
  # Output er dashboard-elementer (admin → Fotos-køen); Discord kun ved fejl.
  photos:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Foreslå atletfotos fra bio-sider
        run: npx tsx pipeline/scrape/suggest-photos.ts --limit 200
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Backfill skolefarver (nye skoler)
        run: npx tsx pipeline/scrape/school-colors.ts --limit 100
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Pensionér dimittender efter badge-året
        run: npx tsx pipeline/report/retire-graduates.ts --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Discord ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Foto/farve-job fejlede\",\"description\":\"[Se loggen]($RUN_URL).\",\"color\":15158332,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"

  # ANALYZE: giv SQLite-planlæggeren friske tal om den base scrapet lige har ændret.
  #
  # Uden `sqlite_stat1` gætter planlæggeren, og gættet er dyrt: 2026-09-02 læste
  # `getAllSchoolSlugs` 1.794.155 rækker for at returnere ~200 slugs, og 2.180
  # efter ANALYZE — 823 gange forskel, af statistik alene. Indekserne lå der hele
  # tiden (047); det manglende var tallene. Se IDEA-datalag.md §7b.
  #
  # KUN søndag. Selve ANALYZE koster ~1,4 mio. læste rækker (målt 2026-09-04),
  # altså ~28 % af D1-frikvotens 5 mio./døgn. Workflow'et har MIDLERTIDIGT også en
  # natlig 22:00-cron under UK-opstarten, og på den ville en daglig ANALYZE spise
  # mere kvote end den sparer. Fjernes den natlige cron igen, kan `if`'en falde bort.
  #
  # curl frem for wrangler/tsx: ét REST-kald behøver hverken npm ci eller checkout.
  analyze:
    needs: scrape
    if: always() && (github.event.schedule == '0 4 * * 0' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ANALYZE på D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          RES="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$CLOUDFLARE_D1_DATABASE_ID/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"sql":"ANALYZE;"}')"
          echo "$RES"
          echo "$RES" | grep -q '"success":true' || { echo "ANALYZE fejlede"; exit 1; }

  # Én samlet Discord-besked efter alle matrix-divisioner (ikke 3 separate).
  # Både manuelle (Discord /scrape) OG den planlagte søndags-cron — ugentlig, så lav støj.
  notify:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord-notifikation
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPE_RESULT: ${{ needs.scrape.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCRAPE_RESULT" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Roster-scraping færdig"
            DESC="Alle divisioner (D1–D3) scrapet. Tjek admin for nye danske atleter."
          else
            COLOR=15158332
            TITLE="❌ Roster-scraping fejlede"
            DESC="Scraping fejlede (resultat: $SCRAPE_RESULT). [Se loggen]($RUN_URL)."
          fi
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"description\":\"$DESC\",\"color\":$COLOR,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
