name: Ugentlig roster-scraping

on:
  schedule:
    # Søndag kl. 04:00 UTC (05:00 dansk tid)
    - cron: '0 4 * * 0'
    # MIDLERTIDIG natlig kørsel under UK-opstarten (2026-08-04 →).
    # Scraperen roterer gennem ~1.700 skoler og fanger kun en del pr. kørsel;
    # ugentligt ville tage måneder om at finde alle briter. 22:00 UTC ligger
    # frit af de øvrige jobs (js-scrape 03:00, katalog 21:00, morgen-cluster).
    # ⚠️ FJERN denne linje igen når UK-tallet flader ud — ellers scrapes der
    # unødigt hver nat resten af sitets levetid.
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      matrix:
        division: [D1, D2, D3]
      max-parallel: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Scrape rosters (${{ matrix.division }})
        run: npx tsx pipeline/scrape/scrape-rosters.ts --division ${{ matrix.division }} --limit 500 --max-age-days 30
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

  # Efter scrape: foto-forslag fra nye bio-sider + farver for nye skoler.
  # Output er dashboard-elementer (admin → Fotos-køen); Discord kun ved fejl.
  photos:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Foreslå atletfotos fra bio-sider
        run: npx tsx pipeline/scrape/suggest-photos.ts --limit 50
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Backfill skolefarver (nye skoler)
        run: npx tsx pipeline/scrape/school-colors.ts --limit 100
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Pensionér dimittender efter badge-året
        run: npx tsx pipeline/report/retire-graduates.ts --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Discord ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Foto/farve-job fejlede\",\"description\":\"[Se loggen]($RUN_URL).\",\"color\":15158332,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"

  # Én samlet Discord-besked efter alle matrix-divisioner (ikke 3 separate).
  # Både manuelle (Discord /scrape) OG den planlagte søndags-cron — ugentlig, så lav støj.
  notify:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord-notifikation
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCRAPE_RESULT: ${{ needs.scrape.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCRAPE_RESULT" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Roster-scraping færdig"
            DESC="Alle divisioner (D1–D3) scrapet. Tjek admin for nye danske atleter."
          else
            COLOR=15158332
            TITLE="❌ Roster-scraping fejlede"
            DESC="Scraping fejlede (resultat: $SCRAPE_RESULT). [Se loggen]($RUN_URL)."
          fi
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"description\":\"$DESC\",\"color\":$COLOR,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
