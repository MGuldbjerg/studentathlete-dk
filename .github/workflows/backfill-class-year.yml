name: Backfill årgangsbetegnelser

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max antal atleter at behandle'
        required: false
        default: '200'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Backfill class_year
        run: npx tsx pipeline/scrape/backfill-class-year.ts --limit ${{ github.event.inputs.limit || '200' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
