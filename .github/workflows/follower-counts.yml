name: Følgertal (dagligt)

# One follower count per social account per day → follower_counts (migration
# 061), for the statistics dashboard's growth chart. Read-only towards the
# platforms; one small D1 upsert per account. No LLM.

on:
  schedule:
    - cron: '50 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (skriv intet)'
        required: false
        default: 'false'

jobs:
  followers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx pipeline/social/collect-followers.ts ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          # Same list as social-post.yml — keep them in step.
          SOCIAL_DISABLED_CHANNELS: facebook
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_UK_HANDLE: ${{ secrets.BLUESKY_UK_HANDLE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_UK_PAGE_ID: ${{ secrets.FB_UK_PAGE_ID }}
          FB_UK_PAGE_ACCESS_TOKEN: ${{ secrets.FB_UK_PAGE_ACCESS_TOKEN }}
          IG_UK_USER_ID: ${{ secrets.IG_UK_USER_ID }}
          IG_UK_LOGIN: instagram
          IG_UK_ACCESS_TOKEN: ${{ secrets.IG_UK_ACCESS_TOKEN }}
          THREADS_DK_USER_ID: ${{ secrets.THREADS_DK_USER_ID }}
          THREADS_DK_ACCESS_TOKEN: ${{ secrets.THREADS_DK_ACCESS_TOKEN }}
          THREADS_UK_USER_ID: ${{ secrets.THREADS_UK_USER_ID }}
          THREADS_UK_ACCESS_TOKEN: ${{ secrets.THREADS_UK_ACCESS_TOKEN }}

      - name: Discord ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Følgertal blev ikke hentet for alle konti\",\"description\":\"[Se loggen]($RUN_URL).\",\"color\":15158332,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
