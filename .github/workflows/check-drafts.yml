name: Kvalitetstjek af kladder

# Mikkel bad om at hver kladde bliver kvalitetstjekket, så læringen går hurtigere.
# Dette workflow er den halvdel der ikke kræver at din maskine er tændt:
#
#   check-drafts.ts    de syv mekaniske tjek (tal, navne, citater, identitet,
#                      stedord, tid, årgang) — gratis, deterministisk, og skriver
#                      resultatet til admin-badgen (articles.fabrication_risk)
#   notify-reviews.ts  pinger Discord om Claudes gennemgange, som køres lokalt af
#                      scripts/review-drafts.sh. Gennemgangen ligger i D1, så
#                      pinget behøver ikke komme fra samme maskine.
#
# Hver 3. time: kladder ankommer om morgenen (generate 07:30 UTC), og en kø der
# ligger urørt til aften er præcis det problemet handler om. Kørslen er gratis og
# idempotent — en uændret kladde tjekkes ikke igen (content_hash).

on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Tjek igen selvom kladden er uændret'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Mekanisk tjek af kladder
        run: |
          ARGS="--notify"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          npx tsx pipeline/generate/check-drafts.ts $ARGS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Ping om Claudes gennemgange
        run: npx tsx pipeline/generate/notify-reviews.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Discord ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Kvalitetstjek af kladder fejlede\",\"description\":\"[Se loggen]($RUN_URL).\",\"color\":15158332,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
