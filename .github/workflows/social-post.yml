name: Social media-kø

on:
  # Timevis dræn af social-køen. Pacing-logikken (pipeline/social/pacing.ts)
  # afgør selv om der faktisk postes — de fleste kørsler er no-ops.
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (vis hvad der ville blive postet)'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Kortene FØR opslaget, i samme kørsel. «Pre-render kampkort» kører også
      # selv kl. :05, men GitHub Actions' skemalægning skrider (18. og 20.
      # august postede social-kørslen før kort-kørslen, og begge opslag blev
      # uden billede). Kaldet er idempotent og springer eksisterende kort over,
      # så prisen er sekunder når der intet nyt er.
      - name: Pre-render manglende kampkort (før opslag)
        run: npx tsx pipeline/render/render-cards.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Enqueue + dræn social-kø
        run: npx tsx pipeline/social/post-social.ts ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # Britisk konto — egne secrets, så et manglende UK-secret giver en
          # sprunget kanal og ikke et opslag fra den danske konto.
          BLUESKY_UK_HANDLE: ${{ secrets.BLUESKY_UK_HANDLE }}
          BLUESKY_UK_APP_PASSWORD: ${{ secrets.BLUESKY_UK_APP_PASSWORD }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      # Kun ved fejl — vellykkede opslag er synlige på kanalerne selv
      # (samme princip som discover-daily: ingen "postede N"-støj).
      - name: Discord-notifikation ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Social-opslag fejlede\",\"description\":\"Et opslag kunne ikke postes. Tjek [GitHub Actions](https://github.com/MGuldbjerg/studentathlete-dk/actions/workflows/social-post.yml) — efter 3 forsøg markeres opslaget som failed.\",\"color\":15158332,\"footer\":{\"text\":\"StudentAthlete.dk social\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
