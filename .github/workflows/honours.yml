name: Udmærkelser

# Læser atleternes bio-sider og fylder karriere-tabellen på profilerne.
# Hele køen roterer på `honors_checked_at`, så hver kørsel læser dem der har
# ventet længst — nye atleter først (NULLS FIRST).
#
# Rendering er det der flytter dækningen: den nye Sidearm sender en tom skal og
# henter bioen med JavaScript, og de sider kan en almindelig fetch aldrig læse.
# Rendering runs in ONE lane with gaps. Since Workers Paid (2026-09-30) the
# ceiling is the shared browser budget (pipeline/lib/browser-budget.ts):
# BROWSER_RUN_SHARE=0.5 lets this run use at most half of what is left of
# today's share, so box scores for the day's articles still get rendered. The
# page cap is high on purpose — the budget, not the count, ends the run.
on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: "Antal atleter at læse"
        required: false
        default: '3000'
      render:
        description: "Loft over antal renderinger (0 = ingen)"
        required: false
        default: '200'

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Hent udmærkelser fra bio-sider
        run: |
          npx tsx pipeline/scrape/scrape-honors.ts \
            --limit ${{ inputs.limit || '3000' }} \
            --render ${{ inputs.render || '200' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          BROWSER_RUN_SHARE: '0.5'

      # Conference award releases: weekly awards, season teams, honour rolls
      # (pipeline/scrape/conference-honors.ts). Ten days back each night, so a
      # missed run is caught up by the next one.
      - name: Honours from conference releases
        run: npx tsx pipeline/scrape/scrape-conference-honors.ts --days 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      # Kun ved fejl. Fundene står på profilerne og taler for sig selv.
      - name: Discord-notifikation ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Udmærkelses-høsten fejlede\",\"description\":\"Karriere-tabellerne blev ikke opdateret. [Se loggen]($RUN_URL).\",\"color\":15158332,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
