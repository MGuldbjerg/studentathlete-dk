name: Meta-forbindelse (kanariefugl)

# Læse-kald mod Facebook-siden og Instagram-kontoen. Poster INTET.
#
# Den svarede før på «virker tokenet stadig?» ved at slå sidens navn op. Det
# spørgsmål var for nemt. 15. september 2026 blev FB_PAGE_ACCESS_TOKEN fornyet
# uden `pages_manage_posts`; et sådant token læser siden fint, så kanariefuglen
# var grøn mens Facebook var dødt — opdaget elleve dage senere, af køen.
#
# Nu spørger den om RETTIGHEDERNE ved navn (pipeline/social/check-tokens.ts),
# og advarer i forvejen hvis tokenet har en udløbsdato. Tokenet sendes aldrig
# i en URL og skrives aldrig ud.
#
# Dagligt, ikke ugentligt: et token der dør mandag eftermiddag skal ikke først
# opdages næste mandag. Kørslen er to Graph-kald og koster ingenting.

on:
  schedule:
    - cron: '0 7 * * *' # hver dag 07:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Tjek Meta-tokens (scopes + udløb)
        id: tokens
        env:
          # Same list as social-post.yml — keep them in step. A disabled
          # channel's token problems are logged, not alarmed on; when its token
          # starts passing, the step below says so (2026-09-24).
          SOCIAL_DISABLED_CHANNELS: facebook
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Uden disse to kan scopes og udløb ikke aflæses, og tjekket falder
          # tilbage til det gamle «kan siden læses?». De er app-legitimation,
          # ikke bruger-legitimation: de står på app'ens side i Meta for
          # Developers og kræver ingen indlogning som sidens administrator.
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: npx tsx pipeline/social/check-tokens.ts

      - name: Discord — a disabled channel works again
        if: success() && steps.tokens.outputs.recovered != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RECOVERED: ${{ steps.tokens.outputs.recovered }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"🟢 $RECOVERED: tokenet virker nu\",\"description\":\"Kanalen er stadig slået fra. Fjern den fra SOCIAL_DISABLED_CHANNELS i social-post.yml og meta-check.yml, så begynder den at poste.\",\"color\":3066993,\"footer\":{\"text\":\"StudentAthlete.dk social\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"

      - name: Discord-notifikation ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Meta-tokenet duer ikke længere\",\"description\":\"Enten er tokenet dødt, eller også mangler det en rettighed det skal bruge for at poste — kørslen siger hvilken. Nye artikler bliver IKKE delt på Facebook/Instagram før det er rettet. Se [kørslen](https://github.com/MGuldbjerg/studentathlete-dk/actions/workflows/meta-check.yml).\",\"color\":15158332,\"footer\":{\"text\":\"StudentAthlete.dk social\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
