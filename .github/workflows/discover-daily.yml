name: Discovery (token-fri)

on:
  schedule:
    # Hver 6. time: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Tjek kilder for nye historier
        id: discover
        run: |
          npx tsx pipeline/discover/check-sources.ts --limit 200 2>&1 | tee /tmp/discover.txt
          echo "found=$(grep -oP '(?<=Fundet )\d+' /tmp/discover.txt | tail -1 || echo 0)" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      # Notifikation: manuelle kørsler (Discord /discover, admin, GitHub UI) altid.
      # Planlagte cron-kørsler (hver 6. time) KUN når der faktisk blev fundet nye
      # historier — eller ved fejl. Ellers ville et tomt no-op spamme Discord 4x/dag.
      - name: Discord-notifikation
        if: always() && (github.event_name == 'workflow_dispatch' || job.status != 'success' || steps.discover.outputs.found != '0')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          FOUND: ${{ steps.discover.outputs.found }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Discovery færdig"
            DESC="Fandt ${FOUND:-0} ny(e) historie(r). Tjek admin."
          else
            COLOR=15158332
            TITLE="❌ Discovery fejlede"
            DESC="Discovery fejlede. [Se loggen]($RUN_URL)."
          fi
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"description\":\"$DESC\",\"color\":$COLOR,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
