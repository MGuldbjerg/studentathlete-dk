name: Discovery (token-fri)

on:
  schedule:
    # Every 2 hours at :17 (Mikkel, 2026-10-27: «ramp up the processes»).
    # Was every 6 h on the hour, which GitHub delayed and dropped to ~3 runs a
    # day: 200 schools a run reached ~600 of the 776 feeds a day, and 177 had
    # not been checked for over 24 h. A school is still read at most every 6 h
    # (check-sources.ts), so more runs means every school gets its turn, and a
    # story reaches the desk sooner (freshness: 1 day for a goal or assist).
    # :17, not :00 — the top of the hour is where GitHub delays and drops.
    # Cost: GitHub minutes (public repo: free) and a few thousand D1 rows a run.
    - cron: '17 */2 * * *'
  workflow_dispatch:

# A slow run (the body pass opens up to 600 pages) must not overlap the next.
concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # 50, not 30 (2026-10-26): the article-body pass opens up to 600 pages a run.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Tjek kilder for nye historier
        run: npx tsx pipeline/discover/check-sources.ts --limit 200
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      # Stories er IKKE dashboard-elementer (Mikkel: en story uden kladde har ingen
      # værdi). Derfor INGEN "fandt N"-besked — kun ved FEJL, så et brudt discovery-job
      # ikke går ubemærket. Dashboard-signalet er "/generate: N kladder klar".
      - name: Discord-notifikation ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Discovery fejlede\",\"description\":\"check-sources fejlede. [Se loggen]($RUN_URL).\",\"color\":15158332,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
