name: Opus editor (UK)

# Mikkel, 2026-10-10: «an automatic publish/reject job by Opus at midnight and
# midday — only for the UK articles». pipeline/fix/auto-editor.ts decides every
# unpublished UK draft (publish after correction / reject / hold), and
# apply-draft-decisions.ts publishes SPACED 17–23 min apart, as always.
# Danish drafts are never touched.
#
# Runs on Mikkel's Claude subscription (CLAUDE_CODE_OAUTH_TOKEN), not an API key.
#
# The repo is public, so this log is public: stdout is ids and actions only
# (--public-log), decisions live in $RUNNER_TEMP and die with the runner, and the
# titles and reasons go to Discord. Never add an upload-artifact step here.
#
# Midnight and midday Copenhagen time. GitHub cron is UTC, Denmark shifts
# between UTC+1 and UTC+2, and GitHub drops or delays scheduled runs by hours
# (the first night: 22:00 never fired, 23:00 ran at 00:33 UTC). So it fires
# hourly through each half-day window, and the gate lets the FIRST run in a
# window through: local time 00–05 or 12–17, and no earlier run of this
# workflow in the same window got past the gate.
#
# At most 12 drafts per run: 12 spaced publishes (17–23 min) plus the Opus calls
# fit inside GitHub's 6-hour job limit; the rest wait for the next window.
#
# Off switch: repo variable AUTO_EDITOR_UK = off.

on:
  schedule:
    - cron: '7 22,23,0,1,2,3,10,11,12,13,14,15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide only — publish and reject nothing'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-editor-uk
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: First run of this half-day window?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          go() { echo "run=$1" >> $GITHUB_OUTPUT; echo "$2"; }
          if [ "${{ vars.AUTO_EDITOR_UK }}" = "off" ]; then go false "AUTO_EDITOR_UK=off — skipping"; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then go true "manual run"; exit 0; fi
          H=$(TZ=Europe/Copenhagen date +%-H)
          if [ "$H" -lt 6 ]; then W=00; elif [ "$H" -ge 12 ] && [ "$H" -lt 18 ]; then W=12; else go false "local hour $H — outside the windows"; exit 0; fi
          START=$(date -u -d "TZ=\"Europe/Copenhagen\" $(TZ=Europe/Copenhagen date +%F) $W:00" +%FT%TZ)
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow auto-editor-uk.yml --created ">=$START" -L 50 --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "${{ github.run_id }}" ] && continue
            S=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '.jobs[].steps[] | select(.name=="Opus decides the UK drafts") | .conclusion // .status')
            case "$S" in success|failure|cancelled|in_progress|queued) go false "run $id already handled the window from $START"; exit 0;; esac
          done
          go true "first run in the window from $START"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - run: npm install -g @anthropic-ai/claude-code
        if: steps.gate.outputs.run == 'true'

      - name: Check Claude login
        if: steps.gate.outputs.run == 'true'
        run: |
          OUT=$(claude -p "Reply with exactly: OK" --allowed-tools "" 2>&1 || true)
          if ! echo "$OUT" | grep -q "OK"; then
            echo "! Claude login failed — run 'claude setup-token' again and update CLAUDE_CODE_OAUTH_TOKEN"; exit 1
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Opus decides the UK drafts
        if: steps.gate.outputs.run == 'true'
        run: |
          ARGS="--country UK --out $RUNNER_TEMP/decisions.json --limit 12"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npx tsx pipeline/fix/auto-editor.ts $ARGS
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_UK: ${{ secrets.DISCORD_WEBHOOK_UK }}

      - name: Reject and publish (spaced)
        if: steps.gate.outputs.run == 'true' && github.event.inputs.dry_run != 'true'
        run: npx tsx pipeline/fix/apply-draft-decisions.ts "$RUNNER_TEMP/decisions.json" --public-log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_UK || secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Opus editor (UK) failed\",\"description\":\"[See the log]($RUN_URL).\",\"color\":15158332,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
