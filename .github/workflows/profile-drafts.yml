name: Profiludkast (baseline + sommer-udvidelse)

# Fylder athletes.profile_draft — PUBLICERER ALDRIG (godkendelse i /admin/profiler).
# To spor i én workflow, valgt ud fra hvilken cron der fyrede (eller manuelt input):
#   baseline: ugentligt søndag 08:00 UTC (efter roster-scrape 04:00) — regelbaserede
#             "startede på X"-udkast for nyopdagede atleter. Ingen LLM.
#   expand:   årligt 5. juli (sommerpausen) — karriere-resumé fra kildebelagte
#             athlete_events via gratis LLM-kæde + deterministisk verifikation.

on:
  schedule:
    - cron: '0 8 * * 0'   # baseline, søndag efter roster-scrape
    - cron: '0 6 5 7 *'   # expand, 5. juli (sommer-downtime)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Hvilket spor'
        type: choice
        options: [baseline, expand, both]
        default: baseline
      dry_run:
        description: 'Kør uden at skrive til DB'
        type: boolean
        default: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Vælg spor
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          elif [ "$CRON" = "0 6 5 7 *" ]; then
            MODE="expand"
          else
            MODE="baseline"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "both" ]; then
            echo "flags=--baseline --expand" >> "$GITHUB_OUTPUT"
          else
            echo "flags=--$MODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Byg profiludkast
        run: |
          npx tsx pipeline/profiles/build-profile-drafts.ts ${{ steps.mode.outputs.flags }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} 2>&1 | tee drafts-run.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Udkast i køen = dashboard-synlig værdi → altid besked med antal + link.
      # (Stories/interne tællere får ingen besked; udkast til godkendelse gør.)
      - name: Discord — kørsel færdig
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            TITLE="✅ Profiludkast ($MODE) klar"
            COLOR=5793266
          else
            TITLE="❌ Profiludkast ($MODE) fejlede"
            COLOR=15158332
          fi
          SUMMARY="$(grep -E '^(Baseline|Expand):' drafts-run.log 2>/dev/null | tr '\n' ' ')"
          [ -z "$SUMMARY" ] && SUMMARY="Ingen opsummering i loggen."
          PAYLOAD="$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$SUMMARY"$'\n\n'"Godkend: https://studentathlete.dk/admin/profiler — [Se loggen]($RUN_URL)" \
            --argjson color "$COLOR" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds:[{title:$title,description:$desc,color:$color,footer:{text:"StudentAthlete.dk pipeline"},timestamp:$ts}]}')"
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
