name: Instagram-handles

# Læser atleternes bio-sider og lægger de handles, atleterne selv har oplyst,
# i admin → Instagram. Følgningen er manuel og bliver det: Meta har intet
# følge-endpoint, og et script der klikker ville sætte selve udgiver-kontoen
# på spil (se migration-053).
#
# Ingen LLM, ingen kvote — en almindelig fetch pr. atlet plus én pr. atletiksite.
# Køen roterer på `instagram_checked_at`, så en afbrudt kørsel taber intet.
#
# Ugentligt: handles kommer ikke til i døgntakt, og køen tømmes af hånden.
# Søndag 08:20 UTC — fri af discover (00/06/12/18), morgen-klyngen og
# foto-forslagene (09:40/16:40).
on:
  schedule:
    - cron: '20 8 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: "Antal atleter at tjekke i denne kørsel"
        required: false
        default: '3000'
      country:
        description: "Landekode (tomt = alle)"
        required: false
        default: ''

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Hent handles fra bio-sider
        run: |
          npx tsx pipeline/scrape/scrape-instagram.ts \
            --limit ${{ inputs.limit || '3000' }} \
            ${{ inputs.country && format('--country {0}', inputs.country) || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      # Kun ved fejl — fundene er dashboard-elementer og taler for sig selv.
      - name: Discord-notifikation ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Instagram-handles fejlede\",\"description\":\"Køen i admin → Instagram blev ikke fyldt op. [Se loggen]($RUN_URL).\",\"color\":15158332,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
