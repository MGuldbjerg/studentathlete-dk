name: Statistik-siden (dagligt)

# Recomputes the numbers behind /statistik and /statistics into site_stats
# (migration 059). The page reads one row; counting live cost 15 ms CPU on a
# cold start, over Workers' 10 ms ceiling. Two D1 writes per run, no LLM.
#
# 05:40 UTC: after the night's discovery, before the 06:30 morning cluster.

on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsx pipeline/report/build-stats.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      # National team rankings from NCAA.com for the article writer
      # (PLAN-richer-articles.md, step 5.1): ~70 page fetches from here, about
      # 800 D1 row writes into its own table, no LLM. Before the 07:30 and 13:30
      # generation runs. A failure here must not cost the statistics page.
      - name: NCAA team rankings
        continue-on-error: true
        run: npx tsx pipeline/stats/ncaa-rankings.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Discord ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Statistik-siden blev ikke opdateret\",\"description\":\"[Se loggen]($RUN_URL).\",\"color\":15158332,\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
