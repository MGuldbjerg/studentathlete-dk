name: CI (typecheck + tests)

# Kører på hvert push/PR til main — testsuiterne er offline (stubs, ingen D1/LLM)
# og hele kørslen tager ~2 min. Fanger parser-regressioner FØR søndagens scrape.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck src (Next)
        run: npx tsc --noEmit

      - name: Typecheck pipeline
        run: npx tsc -p pipeline/tsconfig.json --noEmit

      # projekt-status.md holds current state only (see its header). Done work
      # belongs in git log, procedures in docs/RUNBOOK.md — it grew to 3,841 lines
      # once, and every session reads it first.
      - name: Status file stays short
        run: |
          n=$(wc -l < projekt-status.md)
          echo "projekt-status.md: $n lines (limit 250)"
          if [ "$n" -gt 250 ]; then
            echo "::error file=projekt-status.md::$n lines — move done work out (git log keeps it), procedures to docs/RUNBOOK.md"
            exit 1
          fi

      # Every tracked _*-test.ts runs: no list to keep in sync. Twelve tests had
      # fallen out of the old hand-kept list without anyone noticing (2026-10-28).
      - name: Unit-tests
        run: |
          set -e
          for t in $(git ls-files '*_*-test.ts' | grep -E '(^|/)_[a-z0-9-]+-test\.ts$'); do
            echo "── $t"
            npx tsx "$t"
          done

      # Ingen Discord-notify: GitHub sender selv mail ved brudt CI på main,
      # og PR-status er synlig i UI'et.

      # Måler taltjekket mod menneskets egne rettelser (offline snapshot).
      # Fejler hvis præcisionen falder — en falsk alarm lærer redaktøren at
      # ignorere advarslerne, og så er tjekket reelt væk.
      - name: Faktatjekkets præcision (backtest-korpus)
        run: npx tsx pipeline/backtest/checker-precision.ts
