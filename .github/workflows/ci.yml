name: CI (typecheck + tests)

# Kører på hvert push/PR til main — testsuiterne er offline (stubs, ingen D1/LLM)
# og hele kørslen tager ~2 min. Fanger parser-regressioner FØR søndagens scrape.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck src (Next)
        run: npx tsc --noEmit

      - name: Typecheck pipeline
        run: npx tsc -p pipeline/tsconfig.json --noEmit

      - name: Unit-tests
        run: |
          set -e
          for t in \
            pipeline/generate/_parse-output-test.ts \
            pipeline/generate/_boxscore-test.ts \
            pipeline/generate/_weekday-test.ts \
            pipeline/generate/_match-facts-test.ts \
            pipeline/generate/_fact-cross-check-test.ts \
            pipeline/generate/_identity-guard-test.ts \
            pipeline/generate/_event-timing-test.ts \
            pipeline/generate/_forward-looking-test.ts \
            pipeline/generate/_group-stories-test.ts \
            pipeline/generate/_quality-check-test.ts \
            pipeline/generate/_draft-pack-test.ts \
            pipeline/checks/_false-transfers-test.ts \
            pipeline/checks/_draft-numbers-test.ts \
            pipeline/checks/_danish-names-test.ts \
            pipeline/checks/_factsheet-attribution-test.ts \
            pipeline/checks/_localised-source-urls-test.ts \
            pipeline/discover/_extract-story-test.ts \
            pipeline/discover/_sensitive-test.ts \
            pipeline/discover/_honors-test.ts \
            pipeline/discover/_story-kind-test.ts \
            pipeline/learn/_mine-edits-test.ts \
            pipeline/lib/_hometown-test.ts \
            pipeline/lib/_hometown-uk-test.ts \
            pipeline/lib/_athlete-identity-test.ts \
            pipeline/lib/_d1-client-test.ts \
            pipeline/lib/_divisions-test.ts \
            pipeline/lib/_notify-test.ts \
            pipeline/lib/_robots-test.ts \
            pipeline/lib/_robots-txt-site-test.ts \
            pipeline/scrape/_team-discovery-test.ts \
            pipeline/scrape/_athletics-site-test.ts \
            pipeline/scrape/parsers/_roster-api-test.ts \
            pipeline/scrape/parsers/_sidearm-test.ts \
            pipeline/social/_social-test.ts \
            pipeline/report/_search-console-test.ts \
            pipeline/report/_indexnow-backfill-test.ts \
            pipeline/profiles/_profile-drafts-test.ts \
            src/lib/_analytics-test.ts \
            src/lib/_site-family-test.ts \
            src/lib/_article-url-test.ts \
            src/lib/_indexnow-test.ts \
            src/lib/_school-name-test.ts \
            src/lib/_school-display-name-test.ts \
            src/lib/_school-team-name-test.ts \
            src/lib/_no-danish-default-test.ts \
            src/lib/_no-danish-in-jsx-test.ts \
            src/lib/_season-badge-test.ts \
            src/lib/_article-blocks-test.ts \
            src/lib/_gender-test.ts \
            src/lib/_site-content-test.ts \
            src/lib/_ui-strings-test.ts \
            src/lib/_athlete-letters-test.ts \
            src/lib/_youtube-test.ts \
            src/lib/_profile-baseline-test.ts \
            src/lib/_profile-baseline-en-test.ts \
            src/lib/_positions-test.ts \
            src/lib/_mcp-server-test.ts \
            src/lib/_athlete-merge-test.ts
          do
            echo "── $t"
            npx tsx "$t"
          done

      # Ingen Discord-notify: GitHub sender selv mail ved brudt CI på main,
      # og PR-status er synlig i UI'et.
