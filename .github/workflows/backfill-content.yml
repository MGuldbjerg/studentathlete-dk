name: Backfill story-indhold

on:
  # Kør manuelt eller én gang dagligt (lidt før artikelgenerering)
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maks antal stories at behandle'
        required: false
        default: '100'
      max_age_days:
        description: 'Ignorer stories ældre end N dage'
        required: false
        default: '14'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Backfill content_raw for stories uden indhold
        run: npx tsx pipeline/discover/backfill-content.ts --limit ${{ github.event.inputs.limit || '100' }} --max-age-days ${{ github.event.inputs.max_age_days || '14' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
