name: Pre-render kampkort

# Timevis (:05 — FØR social-post :15, så nye publiceringer har skarpe kort til
# embeds): renderer 1200×630-kampkort for publicerede artikler uden blob i D1
# (satori+resvg i Node, ingen Worker-CPU-grænse). Idempotent — springer
# eksisterende nøgler over, så kørsler uden nye publiceringer koster ~sekunder.
# Discord KUN ved fejl.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Genrender ALLE kort (efter design-ændring — husk CARD_VERSION-bump)"
        type: boolean
        default: false
      # Set by the Worker right after a publish from /admin or MCP
      # (src/lib/card-dispatch.ts), so the new article's card exists in a minute
      # or two instead of at the next :05. Empty = every missing card, as hourly.
      article:
        description: "Only this article id (render it now, e.g. just after a publish)"
        type: string
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Render manglende kampkort → D1
        # The article id goes through env and a digits-only check, never
        # straight into the shell line.
        run: |
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="--force"; fi
          if [ -n "$ARTICLE" ]; then
            if ! [[ "$ARTICLE" =~ ^[0-9]+$ ]]; then echo "article must be a number, got: $ARTICLE"; exit 1; fi
            ARGS="$ARGS --article $ARTICLE"
          fi
          npx tsx pipeline/render/render-cards.ts $ARGS
        env:
          FORCE: ${{ inputs.force }}
          ARTICLE: ${{ inputs.article }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          # d1 | both | r2 (pipeline/lib/card-store.ts). Unset repo variable = d1.
          CARD_STORE: ${{ vars.CARD_STORE }}
          CARD_R2_BUCKET: ${{ vars.CARD_R2_BUCKET }}

      - name: Discord-notifikation ved fejl
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "❌ Kampkort-prerender fejlede"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          detail: "Nye artikler falder tilbage til 600×315 on-the-fly-kort (sitet virker)."
