name: Pre-render kampkort

# Timevis (:05 — FØR social-post :15, så nye publiceringer har skarpe kort til
# embeds): renderer 1200×630-kampkort for publicerede artikler uden blob i D1
# (satori+resvg i Node, ingen Worker-CPU-grænse). Idempotent — springer
# eksisterende nøgler over, så kørsler uden nye publiceringer koster ~sekunder.
# Discord KUN ved fejl.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Genrender ALLE kort (efter design-ændring — husk CARD_VERSION-bump)"
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Render manglende kampkort → D1
        run: npx tsx pipeline/render/render-cards.ts ${{ inputs.force && '--force' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Discord-notifikation ved fejl
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"❌ Kampkort-prerender fejlede\",\"description\":\"Nye artikler falder tilbage til 600×315 on-the-fly-kort (sitet virker). [Se loggen]($RUN_URL).\",\"color\":15158332,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
