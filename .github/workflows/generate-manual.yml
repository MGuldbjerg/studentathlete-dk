name: Generer artikler

on:
  # Automatisk: én gang dagligt kl. 07:00 UTC (efter morgen-discovery)
  schedule:
    - cron: '30 7 * * *'
  # Manuelt: kan altid trigges fra GitHub eller admin-panelet
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Ignorer historier ældre end N dage'
        required: false
        default: '7'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Generer artikeludkast fra nye historier
        id: generate
        run: |
          npx tsx pipeline/generate/generate-articles.ts --max-age-days ${{ github.event.inputs.max_age_days || '7' }} 2>&1 | tee /tmp/generate-output.txt
          echo "count=$(grep -oP '(?<=Generated )\d+' /tmp/generate-output.txt | tail -1 || echo '?')" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Discord-notifikation
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          ARTICLE_COUNT: ${{ steps.generate.outputs.count }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993
            TITLE="✅ Nye artikler klar"
            DESC="**${ARTICLE_COUNT:-?}** artikeludkast genereret og klar til review.\n[Åbn admin-panel](https://studentathlete.dk/admin/stilguide)"
          else
            COLOR=15158332
            TITLE="❌ Pipeline fejlede"
            DESC="Artikelgenerering fejlede. Tjek [GitHub Actions](https://github.com/MGuldbjerg/studentathlete-dk/actions) for detaljer."
          fi
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"description\":\"$DESC\",\"color\":$COLOR,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
