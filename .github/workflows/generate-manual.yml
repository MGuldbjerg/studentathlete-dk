name: Generer artikler

on:
  # Automatisk: én gang dagligt kl. 07:00 UTC (efter morgen-discovery)
  schedule:
    - cron: '30 7 * * *'
  # Manuelt: kan altid trigges fra GitHub eller admin-panelet
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Ignorer historier ældre end N dage'
        required: false
        default: '7'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Byg faktaark fra nye historier (fase 1)
        run: npx tsx pipeline/generate/build-factsheet.ts --max-age-days ${{ github.event.inputs.max_age_days || '7' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generer artikeludkast fra nye historier
        id: generate
        run: |
          npx tsx pipeline/generate/generate-articles.ts --max-age-days ${{ github.event.inputs.max_age_days || '7' }} 2>&1 | tee /tmp/generate-output.txt
          echo "count=$(grep -oP '(?<=Genereret )\d+' /tmp/generate-output.txt | tail -1 || echo '0')" >> $GITHUB_OUTPUT
          echo "skip_reason=$(grep -oP '(?<=SKIP_REASON=)\S+' /tmp/generate-output.txt | tail -1 || true)" >> $GITHUB_OUTPUT
          echo "pending=$(grep -oP '(?<=pending=)\d+' /tmp/generate-output.txt | tail -1 || true)" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verificér kladder mod faktaark (fase 3)
        if: always()
        run: npx tsx pipeline/generate/verify-article.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Discord-notifikation
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          ARTICLE_COUNT: ${{ steps.generate.outputs.count }}
          SKIP_REASON: ${{ steps.generate.outputs.skip_reason }}
          PENDING_DRAFTS: ${{ steps.generate.outputs.pending }}
        run: |
          COUNT="${ARTICLE_COUNT:-0}"
          if [ "$JOB_STATUS" != "success" ]; then
            COLOR=15158332
            TITLE="❌ Pipeline fejlede"
            DESC="Artikelgenerering fejlede. Tjek [GitHub Actions](https://github.com/MGuldbjerg/studentathlete-dk/actions) for detaljer."
          elif [ "$SKIP_REASON" = "max_pending_drafts" ]; then
            COLOR=15105570
            TITLE="⚠️ Kladde-kø fuld — generering pauset"
            DESC="${PENDING_DRAFTS:-20}+ ugodkendte kladder venter. Godkend eller afvis i [admin-panelet](https://studentathlete.dk/admin), så genoptager pipelinen selv."
          elif [ "$COUNT" = "0" ]; then
            COLOR=10070709
            TITLE="⏭️ Ingen nye historier"
            DESC="Pipeline kørte uden fejl, men fandt ingen nye historier at generere artikler fra."
          else
            COLOR=3066993
            TITLE="✅ ${COUNT} artikeludkast klar"
            DESC="Klar til review i admin-panelet."
          fi
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"description\":\"$DESC\",\"color\":$COLOR,\"footer\":{\"text\":\"StudentAthlete.dk pipeline\"},\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}"
