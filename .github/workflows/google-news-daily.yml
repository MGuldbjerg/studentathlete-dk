name: Google News RSS (daily)

on:
  schedule:
    # Daily at 05:30 UTC — offset from discover-daily.yml (00:00/06:00/12:00/18:00) to avoid D1 contention
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  google-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Discover Google News stories for Danish athletes
        run: npx tsx pipeline/discover/google-news.ts --max-age-days 14 --limit 50
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          # LLM-nøgler til verify-story.ts (disambiguering af lav-tillids matches)
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
