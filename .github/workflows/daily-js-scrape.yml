name: Daglig JS roster-scraping

on:
  schedule:
    # Dagligt kl. 03:00 UTC (04:00 dansk tid)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape-js:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Scrape JS-renderede rosters via CF Browser Rendering
        # Prioriterer rosters på skoler med danske atleter uden bio_url; checked_at
        # ASC roterer gennem dem over flere dage → udfylder bio_url i bidder inden
        # for den gratis browser-kvote (~10 min/dag).
        run: npx tsx pipeline/scrape/scrape-js-rosters.ts --limit 50
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Foreslå profilbilleder fra nye bio-links
        # Plain fetch (ingen browser-kvote) → henter og:image-headshot fra de bio-sider
        # scraperen lige har udfyldt, og lægger dem i godkendelseskøen (admin → Fotos).
        run: npx tsx pipeline/scrape/suggest-photos.ts --limit 200
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
