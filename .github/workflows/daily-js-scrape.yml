name: Daglig JS roster-scraping

on:
  schedule:
    # Dagligt kl. 03:00 UTC (04:00 dansk tid)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scrape-js:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Scrape JS-renderede rosters via CF Browser Rendering
        run: npx tsx pipeline/scrape/scrape-js-rosters.ts --limit 50
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
