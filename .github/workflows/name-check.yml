name: Nordic name check

# Mikkel, 2026-11-02: Sofia «Thogersen» was Thøgersen, and a card with the wrong
# spelling had already gone out. Rosters drop ø/æ/å. This looks at every new Nordic
# athlete once, the night after the roster scrape (22:00) has added them, so the name
# is settled before an article, card or social post exists.
#
# FLAGS ONLY: suspects go to Discord and `name-check.ts --report`; nothing changes
# a name by itself. The fix is pipeline/fix/fix-athlete-name.ts.
#
# Cost: ~20 Haiku calls on the first run (≈1,200 athletes), a handful per night after.
# Needs migration 081 (name_checks). Off switch: repo variable NAME_CHECK = off.

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Athletes at most'
        default: '300'
      dry_run:
        description: 'Judge and print, write nothing'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read  # lets the failure alert name the failed step

concurrency:
  group: name-check
  cancel-in-progress: false

jobs:
  check:
    if: vars.NAME_CHECK != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code

      - name: Pick a Claude account
        uses: ./.github/actions/claude-account
        with:
          primary: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          fallback: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}

      - name: Check new Nordic names
        run: npx tsx pipeline/checks/name-check.ts --limit ${{ github.event.inputs.limit || '300' }} ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Discord on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: "❌ Nordic name check failed"
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
