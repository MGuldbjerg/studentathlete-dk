name: Slet social-opslag

# Fortrydelsen af `social-post.yml`. Kun manuel — der er ingen situation hvor
# noget skal slettes på en tidsplan.
#
# Baggrund: 2026-08-05 postede de danske konti en britisk artikel under UK-
# sitets dark launch. Sletning var indtil da udelukkende et håndarbejde i to
# apps, mens udsendelsen var fuldautomatisk. Den asymmetri er nu væk.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Kø-række-id fra social_posts (mellemrumsadskilt), fx "33 36"'
        required: false
        default: ''
      country:
        description: 'ELLER: slet alt postet for ét land, fx UK'
        required: false
        default: ''
      dry_run:
        description: 'Vis kun hvad der ville blive slettet'
        required: false
        default: 'true'

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Slet opslag
        run: |
          npx tsx pipeline/social/delete-post.ts \
            ${{ github.event.inputs.ids }} \
            ${{ github.event.inputs.country != '' && format('--country={0}', github.event.inputs.country) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
